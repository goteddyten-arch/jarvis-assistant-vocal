name: Jarvis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.13
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync environment
        run: uv sync --locked

      - name: Compile Python sources
        run: uv run python -m compileall -q core tools satellite_pi src jarvis14.py hud.py overlay.py

      - name: Run offline unit tests
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v
